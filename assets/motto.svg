<svg xmlns="http://www.w3.org/2000/svg" width="292" height="36" viewBox="0 0 292 36" role="img">
  <title>了解真相才能获得真正的自由</title>
  <style>
    .reveal {
      animation: typing 9s steps(14, end) infinite;
    }
    .cursor {
      animation: move 9s steps(14, end) infinite, blink 1s steps(1) infinite;
    }
    @keyframes typing {
      0%   { width: 0; }
      35%  { width: 224px; }
      100% { width: 224px; }
    }
    @keyframes move {
      0%   { x: 34px; }
      35%  { x: 258px; }
      100% { x: 258px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip">
      <rect class="reveal" x="34" y="0" width="0" height="36" />
    </clipPath>
  </defs>
  <text x="34" y="24" font-size="16" fill="#6e7781" letter-spacing="0"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        clip-path="url(#typing-clip)">&#12300;&#20102;&#35299;&#30495;&#30456;&#25165;&#33021;&#33719;&#24471;&#30495;&#27491;&#30340;&#33258;&#30001;&#12301;</text>
  <rect class="cursor" x="34" y="8" width="2" height="16" fill="#6e7781" />
</svg>
